<style>
/* ============================================================
   ESTILOS · definidos exclusivamente por el desarrollador
   ============================================================ */
:root{
  --bg:#0b1220; --card:#121b2e; --card2:#18233a; --bd:#27344f;
  --tx:#eef2fb; --mut:#a9b6cf; --ac:#2fa8f0; --ac2:#19b6a6;
  --or:#ff7a1a; --wa:#25d366; --err:#ff6b6b;
  --r:18px; --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 var(--font);min-height:100vh;
  background-image:radial-gradient(900px 420px at 50% -8%,rgba(47,168,240,.22),transparent 70%)}
[hidden]{display:none!important}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ac2);outline-offset:2px;border-radius:10px}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px calc(28px + env(safe-area-inset-bottom))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Cabecera */
.hero{background:var(--card);border:1px solid var(--bd);border-radius:24px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.cover{height:120px;background:linear-gradient(135deg,#0f3b63,#1b6fa8 55%,var(--ac2));position:relative}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 45%,rgba(0,0,0,.4))}
.hbody{padding:0 20px 22px;text-align:center}
.avatar{width:104px;height:104px;border-radius:50%;margin:-52px auto 12px;position:relative;z-index:1;
  display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),var(--ac2));
  border:4px solid var(--card);font:800 2.1rem/1 var(--font);letter-spacing:.02em;color:#04121f;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
h1{margin:0;font-size:1.55rem;line-height:1.2}
.sub{margin:.3rem 0 0;color:var(--mut)}
.estado{display:inline-flex;align-items:center;gap:.45em;margin-top:12px;padding:.3em .85em;border-radius:99px;
  background:rgba(47,179,68,.14);border:1px solid rgba(47,179,68,.45);color:#7ee08f;font-weight:700;font-size:.85rem}
.estado i{width:.55em;height:.55em;border-radius:50%;background:#2fb344}

/* Secciones */
section.box{margin-top:14px;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:18px}
h2{margin:0 0 10px;font-size:1.02rem;letter-spacing:.02em}
.desc{margin:0;color:var(--mut)}
dl{margin:0;display:grid;gap:10px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:baseline;border-bottom:1px solid var(--bd);padding-bottom:10px}
.kv:last-child{border-bottom:0;padding-bottom:0}
dt{color:var(--mut);font-size:.88rem}
dd{margin:0;overflow-wrap:anywhere}
ul.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
ul.chips li{padding:.4em .8em;border-radius:99px;background:var(--card2);border:1px solid var(--bd);font-size:.9rem}

/* Acciones */
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:.55em;min-height:54px;padding:.7em .8em;
  border-radius:14px;border:1px solid var(--bd);background:var(--card2);text-decoration:none;font-weight:700;text-align:center}
.btn:hover{border-color:var(--ac)}
.btn svg{width:1.3em;height:1.3em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.wide{grid-column:1/-1}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#04210f}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#04121f}

/* NFC / QR */
.nfc{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.qrbox{background:#fff;padding:8px;border-radius:12px;line-height:0;border:0;cursor:zoom-in}
.qrbox canvas{width:132px;height:132px;display:block;image-rendering:pixelated}
.nfc p{margin:0 0 8px;color:var(--mut);font-size:.94rem}
.qrerr{color:var(--err);font-size:.92rem;margin:0}
@media (max-width:380px){.nfc{grid-template-columns:1fr;justify-items:center;text-align:center}.kv{grid-template-columns:1fr;gap:2px}}

/* Modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(3,7,14,.82);display:grid;place-items:center;padding:16px}
.mcard{width:100%;max-width:380px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;text-align:center}
.mcard canvas{width:min(78vw,300px);height:min(78vw,300px);background:#fff;padding:12px;border-radius:12px;image-rendering:pixelated}
.mcard p{color:var(--mut);margin:.7rem 0;font-size:.92rem;overflow-wrap:anywhere}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}

/* Aviso */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;
  background:#0a0f1a;border:1px solid var(--bd);color:var(--tx);padding:.7em 1.1em;border-radius:12px;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.err{border-color:var(--err)}

/* Módulo institucional (naranja sobre fondo oscuro) */
.inst{margin-top:26px;background:#000;border:1px solid rgba(255,122,26,.45);border-radius:var(--r);padding:20px;text-align:center}
.inst img{height:46px;max-width:100%;display:block;margin:0 auto 12px}
.inst p{margin:.4rem 0;color:#cfd4dc;font-size:.93rem}
.inst .links{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.inst .links a{display:flex;justify-content:center;align-items:center;min-height:46px;border-radius:12px;border:1px solid rgba(255,122,26,.55);
  color:var(--or);text-decoration:none;font-weight:700;padding:.5em .8em;overflow-wrap:anywhere}
.inst .links a:hover{background:rgba(255,122,26,.12)}
.legal{margin-top:16px;border-top:1px solid rgba(255,255,255,.14);padding-top:12px;text-align:left}
.legal summary{cursor:pointer;color:var(--or);font-weight:700}
.legal p{font-size:.84rem;color:#aab1bd}

.aviso{margin-top:14px;text-align:center;color:var(--mut);font-size:.88rem}
@media (prefers-reduced-motion:no-preference){.wrap>*{animation:in .5s ease both}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (min-width:900px){.wrap{padding-top:34px}}
</style>
</head>

const NS = 'http://www.w3.org/2000/svg';

  wa:'M21 12a9 9 0 0 1-13.4 7.8L3 21l1.3-4.4A9 9 0 1 1 21 12z|M9 9c.3 2.5 2.5 4.7 5 5l1.3-1.3-1.8-1-.8.6c-.8-.4-1.5-1.1-1.9-1.9l.6-.8-1-1.8z',

  mail:'M3 6h18v12H3z|M3 7l9 6 9-6',
  ig:'M4 4h16v16H4z|M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z|M17 7h.01',
  web:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z|M3 12h18|M12 3c3 3 3 15 0 18|M12 3c-3 3-3 15 0 18',
  user:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z|M4 21a8 8 0 0 1 16 0',

function icon(name){
  const s = document.createElementNS(NS,'svg');
  s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('aria-hidden','true');
  (ICONS[name]||'').split('|').forEach(d => { const p = document.createElementNS(NS,'path'); p.setAttribute('d',d); s.appendChild(p); });
  return s;
}
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v; else n.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return n;
}
const txt = v => (typeof v === 'string' ? v.trim() : '');
function toast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast' + (isErr ? ' err' : ''); t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 3800);
}
function safeUrl(u, protos){
  try { const x = new URL(String(u||'').trim()); return (protos||['https:']).includes(x.protocol) ? x.href : ''; }
  catch(e){ return ''; }
}
function isPublicUrl(u){
  const href = safeUrl(u, ['https:','http:']); if (!href) return false;
  const h = new URL(href).hostname;
  return !(h === 'localhost' || /^127\./.test(h) || /^10\./.test(h) || /^192\.168\./.test(h) || /^172\.(1[6-9]|2\d|3[01])\./.test(h) || /^\d+\.\d+\.\d+\.\d+$/.test(h));
}
function validPhone(p){ return /^549\d{10}$/.test(String(p||'')); }       // móvil Argentina en formato internacional
function validEmail(e){ return /^[^\s@<>]+@[^\s@<>]+\.[^\s@<>]+$/.test(String(e||'')); }
function validIg(u){ return /^[A-Za-z0-9._]{1,30}$/.test(String(u||'')); }
function waLink(num, msg){ return validPhone(num) ? 'https://wa.me/' + num + (msg ? '?text=' + encodeURIComponent(msg) : '') : ''; }
function safeImg(u){
  const s = txt(u); if (!s) return '';
  if (/^(https:\/\/|\.{0,2}\/)[^\s"'<>]+$/.test(s) && !/^javascript:/i.test(s)) return s;
  return '';
}

function vcardText(){
  const t = CONFIG.titular, c = CONFIG.contacto;
  const esc = s => String(s).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
  const L = ['BEGIN:VCARD','VERSION:3.0',
    'N:' + esc(t.apellido) + ';' + esc(t.nombre) + ';;;',
    'FN:' + esc(t.nombre + ' ' + t.apellido)];
  if (t.empresa) L.push('ORG:' + esc(t.empresa));
  if (t.cargo) L.push('TITLE:' + esc(t.cargo));
  if (validPhone(c.whatsapp)) L.push('TEL;TYPE=CELL:+' + c.whatsapp);
  if (validEmail(c.email)) L.push('EMAIL;TYPE=INTERNET:' + c.email);
  const web = safeUrl(c.web); if (web) L.push('URL:' + web);
  if (t.ciudad || t.provincia || t.pais) L.push('ADR;TYPE=WORK:;;' + esc(t.direccion||'') + ';' + esc(t.ciudad||'') + ';' + esc(t.provincia||'') + ';;' + esc(t.pais||''));
  if (validIg(c.instagram)) L.push('X-SOCIALPROFILE;TYPE=instagram:https://instagram.com/' + c.instagram);
  L.push('END:VCARD');
  return L.join('\r\n');
}
function download(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function saveVcard(){
  try {
    download(new Blob([vcardText()], {type:'text/vcard;charset=utf-8'}), 'Nicolas-Romero-Alvarado.vcf');
    toast('Contacto descargado. Abrilo para guardarlo en tu agenda.');
  } catch(e){ toast('No se pudo generar el contacto en este navegador.', true); }
}
async function shareCard(){
  const url = CONFIG.ficha.url;
  if (!isPublicUrl(url)) { toast('La dirección de la ficha todavía no está disponible.', true); return; }
  const data = { title: CONFIG.titular.nombre + ' ' + CONFIG.titular.apellido + ' · ' + CONFIG.titular.empresa, url };
  try {
    if (navigator.share) { await navigator.share(data); return; }
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(url); toast('Enlace copiado.'); return; }
    toast('Tu navegador no permite compartir desde acá. Copiá la dirección de la barra del navegador.', true);
  } catch(e){ if (e && e.name !== 'AbortError') toast('No se pudo compartir el enlace.', true); }
}

/* QR */
function drawQr(canvas, url, size){
  if (typeof qrcode !== 'function') throw new Error('lib');
  const q = qrcode(0, 'M'); q.addData(url); q.make();
  const n = q.getModuleCount(), cell = Math.max(2, Math.floor(size / n)), px = cell * n;
  canvas.width = px; canvas.height = px;
  const g = canvas.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,px,px); g.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r,c)) g.fillRect(c*cell, r*cell, cell, cell);
}
function qrBlocked(){
  const u = CONFIG.ficha.url;
  if (!txt(u)) return 'La dirección pública de la ficha está [PENDIENTE]: todavía no se puede generar el código QR.';
  if (!isPublicUrl(u)) return 'La dirección configurada no es una URL pública válida: no se genera el QR.';
  return '';
}
function openQrModal(opener){
  const msg = qrBlocked(); if (msg) { toast(msg, true); return; }
  const prev = document.activeElement;
  const canvas = el('canvas', {role:'img','aria-label':'Código QR ampliado de la ficha de ' + CONFIG.titular.nombre + ' ' + CONFIG.titular.apellido});
  try { drawQr(canvas, CONFIG.ficha.url, 600); } catch(e){ toast('No se pudo generar el código QR.', true); return; }
  const close = el('button', {type:'button', class:'btn', 'aria-label':'Cerrar código QR'}, icon('x'), 'Cerrar');
  const dl = el('button', {type:'button', class:'btn pri', 'aria-label':'Descargar código QR como imagen'}, icon('dl'), 'Descargar');
  const card = el('div', {class:'mcard', role:'dialog','aria-modal':'true','aria-label':'Código QR'},
    canvas, el('p', {text: CONFIG.ficha.url}), el('div', {class:'mrow'}, dl, close));
  const modal = el('div', {class:'modal'}, card);
  const shut = () => { modal.remove(); document.removeEventListener('keydown', onKey); if (prev && prev.focus) prev.focus(); };
  const onKey = e => {
    if (e.key === 'Escape') shut();
    if (e.key === 'Tab') { const f = [dl, close]; const i = f.indexOf(document.activeElement);
      e.preventDefault(); f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus(); }
  };
  close.addEventListener('click', shut);
  modal.addEventListener('click', e => { if (e.target === modal) shut(); });
  dl.addEventListener('click', () => {
    canvas.toBlob(b => { if (b) download(b, 'QR-Nicolas-Romero-Alvarado.png'); else toast('No se pudo descargar la imagen.', true); }, 'image/png');
  });
  document.addEventListener('keydown', onKey);
  document.body.appendChild(modal); close.focus();
}

  /* Acciones */

  if (validIg(C.instagram)) acts.appendChild(el('a', {class:'btn', href:'https://instagram.com/' + C.instagram, target:'_blank', rel:'noopener noreferrer', 'aria-label':'Abrir Instagram @' + C.instagram}, icon('ig'), 'Instagram'));
  const web = safeUrl(C.web);

  const bSave = el('button', {type:'button', class:'btn pri', 'aria-label':'Guardar contacto en la agenda'}, icon('user'), 'Guardar contacto');
  bSave.addEventListener('click', saveVcard); acts.appendChild(bSave);
